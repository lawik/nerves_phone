# Playback goes through a software volume control ("Master") so volume is
# applied cheaply in alsa-lib. Fp3Extras.Volume sets it through ex_audio.
# The control appears the first time the device is opened.
pcm.!default {
  type plug
  slave.pcm "softvol"
}

pcm.softvol {
  type softvol
  slave.pcm "hw:0,0"
  control {
    name "Master"
    card 0
  }
  min_dB -60.0
  max_dB 0.0
}

ctl.!default {
  type hw
  card 0
}

# The microphone: ALSA device "mic" (e.g. `arecord -D mic -c 1 -r 16000`).
#
# It is defined in /data/phone/asound.mic.conf, written by
# Fp3Extras.Mic, because the card's capture device (hw:0,1) has to
# be opened with exactly as many channels as the mixer routes codec mic
# ports into it: one by default (the bottom mic), two when the top mic is
# switched on. "mic" is a plug over hw:0,1 pinned to that count, so a mono
# recording always works: the bottom mic alone by default, both mics mixed
# once the top one is on. Code that wants the two mics apart records two
# channels after Mic.set_secondary(true).
#
# Loaded as a hook so that the file's absence (before the app has written
# it) is not an error.
@hooks [
  {
    func load
    files [ "/data/phone/asound.mic.conf" ]
    errors false
  }
]
