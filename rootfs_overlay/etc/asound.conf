# Playback goes through a software volume control ("Master") so volume is
# applied cheaply in alsa-lib. NervesPhone.Audio.Volume sets it with amixer.
# The control appears the first time the device is opened.
pcm.!default {
  type plug
  slave.pcm "softvol"
}

pcm.softvol {
  type softvol
  slave.pcm "hw:0,0"
  control {
    name "Master"
    card 0
  }
  min_dB -60.0
  max_dB 0.0
}

ctl.!default {
  type hw
  card 0
}
